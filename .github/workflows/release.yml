name: Rejoin Desk Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 -r requirements.txt
      - run: python -m compileall -q .
      - run: python tests/test_reconnect.py
      - run: python tests/test_external_launcher.py
      - shell: pwsh
        run: |
          python -c "import json,os; open('distribution.json','w').write(json.dumps({'repo':os.environ['GITHUB_REPOSITORY']}))"
          python -m PyInstaller --noconfirm --onefile --windowed --hidden-import pystray._win32 --name RejoinDesk --icon artwork/sk.ico --add-data "artwork;artwork" --add-data "heartbeat.luau;." --add-data "distribution.json;." app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import hashlib,json,pathlib,update; p=pathlib.Path('dist/RejoinDesk.exe'); pathlib.Path('dist/rejoin-manifest.json').write_text(json.dumps({'app':'RejoinDesk','version':update.VERSION,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}))"
      - uses: actions/upload-artifact@v4
        with:
          name: RejoinDesk-Windows
          path: dist/*
      - if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import update; print(update.VERSION)"
          if ($env:GITHUB_REF_NAME -ne "main" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag e versão precisam corresponder." }
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create "v$version" --target $env:GITHUB_SHA dist/RejoinDesk.exe dist/rejoin-manifest.json --generate-notes
